[pytest]
DJANGO_SETTINGS_MODULE = pitchpal.settings
; Python version floor is enforced via pyproject.toml's requires-python (>=3.11);
; pytest itself has no native "minimum interpreter version" ini key.
minversion = 7.4
python_files = tests.py test_*.py *_tests.py
addopts = -s -ra --strict-markers
markers =
    unit: fast, isolated unit tests with no DB or network I/O
    integration: tests exercising multiple components together (DB + service layer)
    e2e: end-to-end tests exercising a full request/response cycle
    slow: tests that are slow to run and can be deselected with -m "not slow"
