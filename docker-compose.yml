version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: pitchpal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pitchpal_network
    ports:
      - "5455:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - pitchpal_network

volumes:
  postgres_data:

networks:
  pitchpal_network:
    driver: bridge
