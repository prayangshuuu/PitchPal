[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitchpal"
version = "0.1.0"
description = "AI practice partner for interviews and pitches"
requires-python = ">=3.11"
dependencies = [
    "Django==5.0.1",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.3.1",
    "psycopg[binary]>=3.1.18",
    "python-dotenv==1.0.0",
    "google-generativeai>=0.8.0",
    "gunicorn==21.2.0",
    "whitenoise==6.6.0",
    "requests==2.31.0",
    "dj-database-url==2.1.0",
    "pdf2image==1.16.3",
    "pillow==10.0.0",
    "django-allauth>=65.19.1",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-django==4.7.0",
    "faker==20.0.0",
]
